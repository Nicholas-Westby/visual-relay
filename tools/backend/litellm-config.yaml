# LiteLLM proxy config for Visual Relay's local model backend.
#
# Served on http://127.0.0.1:4000 (see src/VisualRelay.Domain/ModelBackend.cs
# `BaseUrl`); answers the readiness probe at /health/readiness
# (`ModelBackend.ReadinessPath`). tools/backend/backend.sh start launches it.
#
# Clients (Swival) request a name; LiteLLM dispatches to the upstream provider.
# The `model_name`/alias set here is the SOURCE-OF-TRUTH that Visual Relay's
# generated swival.toml targets (src/VisualRelay.Core/Execution/SwivalProfileSession.cs
# `DefaultToml`) — keep the names in sync with that file.
#
# No secrets live here: every `api_key` reads from the environment via
# `os.environ/<KEY>`. Copy .env.example -> .env and fill in the provider keys you
# have; backend.sh sources .env at start. A request only fails if its specific
# provider key is unset — unused providers can stay blank, and the proxy still
# boots (readiness does not require any key).

model_list:
  # --- GLM 5.3 Flash (Zhipu AI) first-party via Z.AI -----------------
  # upstream model: GLM-5.3-Flash on Z.AI's own OpenAI-compatible API, reached
  # through litellm's native `zai` provider (which resolves the base URL
  # to https://api.z.ai/api/paas/v4). Gated by ZAI_API_KEY; the frontier
  # chain in BackendConfigGenerator lists this FIRST and falls through to
  # the HF-routed hf-glm-5.3-flash below when that key is absent, so a user
  # with only HF_TOKEN reaches the same upstream model by a different host.
  # 320B-A18B, 1M-token context, natively multimodal (text/image/video in).
  # Always-thinking model: `thinking: {"type": "disabled"}` is rejected and
  # only the top-level `reasoning_effort` knob dials it down. Reasoning tokens
  # are emitted BEFORE content, so a tight max_tokens returns empty content
  # with finish_reason=length rather than an error — never cap this model's
  # output low.
  - model_name: glm-5.3-flash
    litellm_params:
      model: zai/glm-5.3-flash
      api_key: os.environ/ZAI_API_KEY
      # Frontier tier ceilings: identical to hf-glm-5.3-flash below, whose
      # comments carry the full rationale (Review reasoning up to ~410s to
      # first token; 480s non-streaming wedge-breaker; fresh TCP per request).
      stream_timeout: 600
      timeout: 480
      extra_headers:
        Connection: close

  # --- GLM 5.3 Flash (Zhipu AI) via Hugging Face / Z.AI --------------
  # upstream model: GLM-5.3-Flash (zai-org/GLM-5.3-Flash), served via HF
  # Inference Providers, provider-pinned to Z.AI (zai-org) via the ":zai-org"
  # suffix. One HF_TOKEN gates access. Same upstream model as the first-party
  # entry above: this is the frontier primary when ZAI_API_KEY is absent, and
  # the first fallback when it is present.
  - model_name: hf-glm-5.3-flash
    litellm_params:
      model: huggingface/zai-org/GLM-5.3-Flash:zai-org
      api_key: os.environ/HF_TOKEN
      # Frontier tier: this backs the Review stage, whose reasoning can take up
      # to ~410s before first token (observed p99 331s, max 412s on the prior
      # frontier model). A per-stream timeout above the global 60s keeps the
      # router from aborting a healthy slow Review; the frontier 660s watchdog
      # is the backstop. Matches the kimi-k2 frontier precedent.
      stream_timeout: 600
      # Non-streaming ceiling: 480s (8 min) > 412s observed worst-case healthy
      # Review; the wedge-breaker, not a latency budget. Same rationale as
      # kimi-k2.
      timeout: 480
      # Fresh TCP per request — see the kimi-k2 note on litellm's per-provider
      # httpx client cache + pooled-connection wedge. GLM 5.3 Flash backs the
      # frontier tier on both routes, so reliability here is critical.
      extra_headers:
        Connection: close

  # --- Moonshot (Kimi) -----------------------------------------------------
  # upstream model: kimi-k2.7-code (released 2026-06-12)
  - model_name: kimi-k2
    litellm_params:
      model: moonshot/kimi-k2.7-code
      api_key: os.environ/MOONSHOT_API_KEY
      # frontier override: kimi-k2 runs the Review stage, whose reasoning
      # legitimately takes up to ~410s before the first token (p99 331s, max 412s).
      # A high per-stream timeout keeps the router's global stream_timeout: 60 from
      # aborting a healthy slow Review; the frontier 660s watchdog is the backstop.
      stream_timeout: 600
      # NON-streaming calls ignore stream_timeout and previously had NO ceiling
      # here — two byte-0 wedges (18 and 30 min, 2026-06-10) sat on exactly that
      # path until manually severed. 480s (8 min) > the 412s observed worst-case
      # healthy Review; the wedge-breaker, not a latency budget.
      timeout: 480
      # Connection: close on every model — litellm caches ONE httpx client per
      # PROVIDER for 3600s and pools upstream TCP (httpx defaults: keepalive 5s,
      # 20 conns). A wedged/half-dead pooled connection then hangs every request to
      # that provider (the rare byte-0 stall that no timeout/fallback caught and a
      # fresh swival process still hit), while other providers flow. A close header
      # forces a fresh TCP per request so a wedge can't be reused. (litellm 1.87.1
      # exposes no config to set httpx Limits/keepalive on the LLM client.)
      extra_headers:
        Connection: close

  # --- DeepSeek (first-party) ---------------------------------------------
  # Per-model timeout (s): DeepSeek intermittently hangs at byte 0 under sustained
  # load. 75s is well above its healthy first-output (≤46s max) but BELOW the
  # relay's per-tier first-output watchdog (cheap 90s / balanced 120s), so a hung
  # DeepSeek call hits this Timeout first → triggers the `fallbacks` below instead
  # of the watchdog killing swival on the same provider. (frontier=kimi-k2 has no
  # such cap — its Review reasoning is legitimately long.) Note the escape is
  # quickest on `balanced`, whose first fallback is kimi-k2 on another provider;
  # `cheap` walks two more DeepSeek entries before it reaches the HF floor, so a
  # provider-wide wedge there is more likely to hit the watchdog than to fail over.
  # upstream model: DeepSeek-V4-Pro-0813 (GA). The dated snapshot is NOT addressable
  # on the first-party API — api-docs.deepseek.com documents `deepseek-v4-pro` as the
  # only Pro model id, and points it at the newest snapshot. Keep the undated id here
  # and record which snapshot it serves in this comment.
  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 75
      # Fresh TCP per request — see the kimi-k2 note above on litellm's per-provider
      # httpx client cache + pooled-connection wedge. DeepSeek backs BOTH the balanced
      # and cheap tiers, so it serves the most stages and is the provider that stalled
      # at byte 0 (installer-4, across cheap- and balanced-tier stages).
      extra_headers:
        Connection: close

  # upstream model: DeepSeek-V4-Flash-0731 (public beta); same undated-id rule as -pro.
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 75
      # Fresh TCP per request — same DeepSeek pooled-connection wedge as -pro above.
      extra_headers:
        Connection: close

  # upstream model: DeepSeek-V4-Flash-Vision-Exp (experimental); same undated-id
  # rule as -pro. This is the cheap-tier primary: identical 1M context, identical
  # published rates and identical peak windows to -flash above. "Exp" means
  # DeepSeek can withdraw it without notice, which is exactly why -flash stays in
  # the cheap chain directly behind it.
  # IMAGES DO NOT SURVIVE THIS ROUTE on litellm 1.92.0 (verified 2026-08-31):
  # DeepSeekChatConfig._transform_messages calls
  # handle_messages_with_content_list_to_str_conversion on EVERY deepseek model,
  # which flattens list-format content to a plain string and silently discards
  # image parts — a screenshot sent through here arrives as text only (96 prompt
  # tokens vs 435 posting the same request straight to api.deepseek.com). So treat
  # this as a text model and leave image work to the `vision` tier until the proxy
  # moves on. Fixed upstream by litellm PR 38397 (merged 2026-08-26); the first
  # stable release carrying it is 1.100.0, unreleased as of this note. Upgrading is
  # not automatic: the venv installs litellm unpinned but only once, so an existing
  # install keeps whatever version it first resolved until the venv is rebuilt.
  - model_name: deepseek-v4-flash-vision-exp
    litellm_params:
      model: deepseek/deepseek-v4-flash-vision-exp
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 75
      # Fresh TCP per request — same DeepSeek pooled-connection wedge as -pro above.
      extra_headers:
        Connection: close

  # --- Hugging Face Inference Providers (one HF_TOKEN, many upstreams) -----
  # Path after `huggingface/` is `<org>/<repo>[:<provider>]` for suffix-pinned
  # routing, or unpinned `<org>/<repo>` for HF auto-routing.
  - model_name: hf-qwen3-coder-next
    litellm_params:
      model: huggingface/Qwen/Qwen3-Coder-480B-A35B-Instruct:novita
      api_key: os.environ/HF_TOKEN
      # Per-model hard ceiling (s): generous floor for HF inference; bounds
      # byte-0 stalls so the fallback chain engages instead of burning the
      # full 40-min stage cap.
      timeout: 120
      # Fresh TCP per request — this is the cross-provider `fallback` alias, so it must
      # stay reliable; same pooled-connection reasoning as the kimi-k2 note above.
      extra_headers:
        Connection: close

  # Vision (multimodal) for the Relay describe pre-step; 30B is the cheaper
  # fallback target.  Auto-routed (no pinned provider) so the HF router
  # selects an available Inference Provider — novita was pinned for 235B and
  # deepinfra for 30B, both confirmed non-serving or failing as of 2026-07-07.
  - model_name: hf-qwen3-vl-235b
    litellm_params:
      model: huggingface/Qwen/Qwen3-VL-235B-A22B-Instruct
      api_key: os.environ/HF_TOKEN
      timeout: 120

  - model_name: hf-qwen3-vl-30b
    litellm_params:
      model: huggingface/Qwen/Qwen3-VL-30B-A3B-Instruct
      api_key: os.environ/HF_TOKEN
      timeout: 120

# Tier aliases give clients a stable name that resolves to a concrete model.
# Re-target the right-hand side when a new winner shows up; clients keep asking
# for the tier name. These are the tier names Visual Relay's swival profiles use.
router_settings:
  # Per-stream first-byte/read timeout (s) for stream=True calls — the ONLY timeout
  # litellm honours for streaming (request_timeout and per-model litellm_params.timeout
  # are ignored for stream=True; see router.py _get_stream_timeout). On a byte-0 hang
  # litellm fails over to the `fallbacks` below after ~stream_timeout. This MUST be
  # below the relay's per-tier first-output watchdog (cheap 90s / balanced 120s), or
  # the watchdog kills swival before the fallback can fire — which is exactly why
  # failover never happened at 120s. 60s lets the fallback win for the fast tiers.
  # frontier (glm-5.3-flash) overrides this via its own per-model stream_timeout,
  # since its Review reasoning legitimately takes up to ~410s before the first token.
  stream_timeout: 60
  model_group_alias:
    frontier: glm-5.3-flash
    # Empirically refuted 2026-06-10 with swival 1.0.30 on generic-provider +
    # localhost LiteLLM (33 proxied calls, zero 4xx): swival never round-trips
    # real reasoning_content into resent assistant tool-call history on ANY
    # alias; the allowlist only gates injection of a " " placeholder, and on
    # generic-provider + localhost the stripping gate is inert regardless of
    # alias. The "-kimi" suffix was vestigial — the clean tier names are fine.
    balanced: deepseek-v4-pro
    cheap: deepseek-v4-flash-vision-exp
    vision: hf-qwen3-vl-235b
    fallback: hf-qwen3-coder-next

  # Provider-diversified fallbacks: on 429/5xx/timeout/auth-error, cascade to
  # alternates on different providers. Keyed by the requested tier alias (LiteLLM
  # looks up fallbacks before resolving the alias).
  fallbacks:
    - frontier: [hf-glm-5.3-flash, kimi-k2, deepseek-v4-pro, hf-qwen3-coder-next, fallback]
    - balanced: [kimi-k2, deepseek-v4-flash, fallback]
    - cheap: [deepseek-v4-flash, deepseek-v4-pro, fallback]
    - vision: [hf-qwen3-vl-30b]

litellm_settings:
  # Drop request params the upstream provider doesn't recognise instead of 400ing
  # — friendlier when swapping models with different feature sets.
  drop_params: true
  # Structured per-request JSON logs to stdout (backend.sh redirects into
  # .relay-scratch/litellm.log).
  json_logs: true
  # Per-request timeout (seconds). Without this, a stalled upstream stream (TCP
  # connected but no tokens) keeps the request open indefinitely, so the
  # `fallbacks` above never fire on "timeout" and the relay's 20-minute subagent
  # wall-clock is the only thing that ends it (observed: fix-timing-estimates
  # stage-6 stalled for the full 20 min). 300s is a generous ceiling over any
  # real generation while still failing a stalled call fast enough that swival's
  # retries + the provider fallbacks can recover within a stage's budget.
  request_timeout: 300
